[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-plugin-lp-to-qubo"
version = "0.1.0"
description = "QUARK plugin for converting Linear Programs to QUBO via qiskit-optimization"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "QUARK Contributors"}]

dependencies = [
    "qiskit-optimization>=0.6.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["quark_plugin_lp_to_qubo"]

[tool.setuptools.package-dir]
"" = "src"
