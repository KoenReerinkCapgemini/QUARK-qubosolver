plugins: ["quark_plugin_lp_to_qubo"]

# Example QUARK configuration demonstrating LP to QUBO conversion
# This pipeline converts simple LP problems to QUBO and solves them

first_layer: &first_layer
  - "simple_lp_provider":
      num_variables: 4
      num_constraints: 2
      seed: 42
  - "simple_lp_provider":
      num_variables: 6
      num_constraints: 3
      seed: 42

second_layer: &second_layer
  "lp_to_qubo_converter":
    penalty_factor: 1.0e6
    continuous_var_precision: 8
    discretisation_scale: 1.0

third_layer: &third_layer
  - "qubo_solver"  # Replace with your QUBO solver (e.g., "pasqal_qaa_solver")

pipeline: [*first_layer, *second_layer, *third_layer]
