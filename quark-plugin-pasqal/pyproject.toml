[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-plugin-pasqal"
version = "0.1.0"
description = "QUARK plugin wrapping Pasqal's Pulser to solve QUBOs via the Quantum Adiabatic Algorithm (QAA)"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "QUARK Contributors"}]

dependencies = [
    "pulser>=1.0.0",
    "pulser-simulation>=1.0.0",
    "scipy>=1.7.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools]
packages = ["quark_plugin_pasqal"]

[tool.setuptools.package-dir]
"" = "src"
